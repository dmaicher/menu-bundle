dama_menu:
    menues:
        test_menu:
            tree_builder: Tests\Functional\TestMenuTreeBuilder

parameters:
    kernel.secret: foo

framework:
    router: { resource: "%kernel.project_dir%/routing.yml", utf8: true }
    test: ~
    http_method_override: false
    session:
        storage_factory_id: session.storage.factory.mock_file

security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: plain

    providers:
        in_memory:
            memory:
                users:
                    foo: { password: bar, roles: [ROLE_FOO] }
                    bar: { password: foo, roles: [ROLE_BAR] }

    firewalls:
        main:
            http_basic: ~
